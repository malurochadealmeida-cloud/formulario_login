<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="container">
      <h1>Cadastro de aluno</h1>
      <br />
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. At beatae
        autem natus saepe commodi dolorem harum libero asperiores aperiam, earum
        maxime totam eveniet ipsam, ipsa iste laboriosam, necessitatibus ea
        magnam!
    
      </p>
       <br>
      <form>
        <div class="form-control">
            <label for="nome">Nome:</label>
            <input type="text" id="nome"/>
        </div>
        <br>
        <div class="form-control">
            <label for="email">Email</label>
             <input type="email" id="email"/>
 </div>
 <br>
             <div class="form-control">
                <label for="senha">Senha</label>
                <input type="password" id="senha"/>
             </div>

             <div class="form-control">
                <label for="data">Data de nascimento</label>
                <input type="date"  />
             </div>

             <div class="form-control">
                <label for="curso">Curso:</label>
                <select  id="curso">
                    <option value="">Selecione</option>
                    <option value="Informatica">Informática</option>
                    <option value="programacao">Programação</option>
                </select>
             </div>
       <div class="form-control">
        <button type="submit" class="btn-cadastro">Cadastrar</button>
        
        <button type="reset" class="btn-limpar">Limpar</button>

       </div>
      </form>

      <br>
      <a href="login.html">Ir para a página de login</a>
    </div>
  </body>
</html>
