<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <a href="index.html">Voltar</a>
</head>
<body>
    <div class="container">
        <h1>Login</h1>

        <form >
            <div class="form control">
                <label for="login">Login:</label>
                <input type="text" id="login"
                placeholder="Digite seu login" />
                </div>
            
               <div class="form-control">
                <label for="login">Login:</label>
                <input type="text" id="login"
                placeholder="Digite seu login" />
                </div>
                
               <div class="form-control">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha ">
              
               </div> 
               
               <div class="senha">
                <a href="esqueci.html">Esqueci minha senha!</a>
            </div>
            <br>
               <div class="form-control">

                <div class ="opcoes">
                    <input type="checkbox" id="lembrar"/>
                    <label for="lembrar">Lembrar meu login</label>
                </div>
               </div>

                <div class="form-control">
                    <label >Tipo de acesso:</label>                        
                   <div class="opcoes">

                    <input type="radio" id="aluno" name="tipo" value="aluno"/>
                    <label for="aluno">Aluno</label>

                    <input type="radio" id="professor" name="tipo" value="professor">
                    <label for="professor">Professor</label>
                   </div>
                </div>
         <div class="form-control">
            <label for="cidade">Cidade:</label>
             <select  id="cidade ">
                <option value="">Selecione sua cidade</option>
                <option value="Jundiaí">Jundiaí</option>
                <option value="campinas">Campinas</option>
                <option value="Ribeirao Preto">Ribeirão Preto</option>
             </select>

             <div class="form-control">
                <button type="submit">Entrar</button>

                
             </div>
         </div>
    
        </div>

        </form>

    </div>


</body>
</html>
